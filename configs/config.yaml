data:
  # Avazu CTR Prediction (Kaggle) train file, downloaded via kagglehub
  raw_path: data/raw/train.gz
  processed_dir: data/processed
  label_col: click
  drop_cols: [id]   # unique row identifier, not a feature
  # Avazu has no continuous numeric features - C1/C14-C21/device_type/device_conn_type
  # are integer-coded categories, not magnitudes, so they go through categorical_cols.
  numeric_cols: []
  categorical_cols:
    - hour
    - C1
    - banner_pos
    - site_id
    - site_domain
    - site_category
    - app_id
    - app_domain
    - app_category
    - device_id
    - device_ip
    - device_model
    - device_type
    - device_conn_type
    - C14
    - C15
    - C16
    - C17
    - C18
    - C19
    - C20
    - C21
  val_size: 0.1
  test_size: 0.1
  random_seed: 42

sampling:
  # Strategy for handling extreme class imbalance (~1:1000): none | undersample | class_weight
  strategy: class_weight
  undersample_neg_ratio: 10   # target negative:positive ratio when strategy=undersample

loss:
  type: focal   # bce | focal
  focal_gamma: 2.0
  focal_alpha: 0.25

model:
  type: fm   # fm | transformer
  embed_dim: 16
  dropout: 0.2
  transformer:
    num_heads: 4
    num_layers: 2
    ff_dim: 64

train:
  batch_size: 1024
  num_epochs: 20
  lr: 1.0e-3
  weight_decay: 1.0e-5
  # optional: stronger decay just for the shared field-embedding table (high-cardinality
  # fields like device_ip have many near-unique-per-row values, prone to overfitting).
  # Defaults to weight_decay above when omitted.
  # embedding_weight_decay: 1.0e-4
  optimizer: adamw   # adam | adamw
  early_stopping_patience: 3
  early_stopping_metric: auc   # auc | logloss (mode inferred: auc->max, logloss->min)
  warmup_steps: 500
